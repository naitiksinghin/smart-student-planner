<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Student Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>📚 Smart Student Planner</h1>
    <div style="text-align:center; margin-bottom:10px;">
    <button onclick="toggleTheme()">🌙 Toggle Dark Mode</button>
</div>


    <div class="container">
        <input type="text" id="subject" placeholder="Subject Name">
        <input type="number" id="total" placeholder="Total Classes">
        <input type="number" id="attended" placeholder="Attended Classes">
        <button onclick="addSubject()">Add Subject</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Attendance %</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
    <canvas id="attendanceChart" width="400" height="200"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
